repos:
  - repo: https://github.com
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [
          'django-stubs',
          'djangorestframework-stubs'
        ]
