x-django-common: &django-common
  build: .
  env_file:
    - .env
  volumes:
    - .:/app
  networks:
    - default
    - shared_rabbitmq_net
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy 
    rabbitmq:
      condition: service_healthy

services:
  django-server:
    <<: *django-common
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  celery_worker:
    <<: *django-common
    command: watchfiles --filter python "celery -A config worker --loglevel=info --concurrency=1 -Q high_priority,default,heavy_tasks"

  celery_beat:
    <<: *django-common
    command: celery -A config beat --loglevel=info
    depends_on:
      - celery_worker

  flower:
    <<: *django-common
    ports:
      - "5555:5555"
    command: celery -A config flower --port=5555
    depends_on:
      - redis
      - celery_worker  

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:8.8-alpine
    container_name: core_redis_broker
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default
      - shared_rabbitmq_net 

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: core_rabbitmq_broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - shared_rabbitmq_net

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: ${S3_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - shared_rabbitmq_net

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  shared_rabbitmq_net:
    name: shared_rabbitmq_net
