version: '3.8'

x-django-common: &django-common
  build: .
  env_file:
    - .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  django-server:
    <<: *django-common
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  celery_worker:
    <<: *django-common
    command: watchfiles --filter python "celery -A config worker --loglevel=info --concurrency=1 -Q high_priority,default,heavy_tasks"

  celery_beat:
    <<: *django-common
    command: celery -A config beat --loglevel=info
    depends_on:
      - celery_worker

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: ${S3_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pg_data:
  redis_data:
  minio_data:
